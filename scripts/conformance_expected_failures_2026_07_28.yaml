# Conformance scenarios excluded from the pass/fail gate of `pnpm run test:conformance` for the
# 2026-07-28 era, served by the stateless adapter
# (runner: @modelcontextprotocol/conformance 0.2.0-alpha.9, `--suite all --spec-version 2026-07-28`).
# The 2025-11-25 era has its own ledger, `conformance_expected_failures_2025_11_25.yaml`.
# The runner fails the command in both directions: an unlisted failure exits 1, and a listed
# scenario that starts passing exits 1 as a stale entry. The loader stringifies each entry, so a
# reason cannot be a field — the reason for each entry is the comment above it.
#
# Never attempted, in either era, and therefore not listed below: the ten extension-tagged
# scenarios — tasks-capability-negotiation, tasks-dispatch-and-envelope, tasks-lifecycle,
# tasks-mrtr-composition, tasks-mrtr-input, tasks-request-headers, tasks-request-state-removal,
# tasks-required-task-error, tasks-status-notifications, tasks-wire-fields. The runner's
# version-applicability predicate drops every scenario whose source carries an `extensionId`
# whenever `--spec-version` is passed, and `--force` reaches only the single-`--scenario` path, so
# no suite sweep can run them. They are not entries here because the runner's baseline comparison
# walks results: an entry for a scenario that never ran would get zero enforcement and could never
# be flagged stale.
#
# Also never attempted in this era, but for the opposite reason — not a gap, just version scoping:
# resources-subscribe and resources-unsubscribe carry `removedIn: 2026-07-28`, so the same predicate
# scopes them out of this revision. They are not part of it; they do run in the legacy era, where
# they are live entries in that ledger. Not entries here either, for the same zero-enforcement
# reason as above.
server:
