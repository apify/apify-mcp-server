    # --- Not supported by this server. ---

    # The stateless adapter registers no `completion/complete` handler and declares no completions
    # capability, so the scenario's request is method-not-found.
    - completion-complete

    # --- Behavior of our pinned SDK (`@modelcontextprotocol/server` 2.0.0-beta.5). No upstream
    # issue exists for either behavior below; filing them is a follow-up, not a blocker. ---

    # 7 of 28 checks fail, for three different reasons. SDK behavior: a request whose `_meta`
    # envelope omits `clientInfo` is answered 200 instead of the expected -32602 / HTTP 400, and
    # `server/discover` carries no `serverInfo` — the SDK stamps server identity into every
    # result's `_meta` instead, which its own source attributes to spec PR #3002 as intentional.
    # The remaining checks need fixture diagnostic tools (`test_missing_capability`,
    # `test_streaming_elicitation`) and a `logging` capability the adapter does not declare.
    - server-stateless
