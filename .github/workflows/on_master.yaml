name: CI (master)

on:
    push:
        branches:
            - master
        tags-ignore:
            - "**" # Ignore all tags to prevent duplicate builds when tags are pushed.

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    code_checks:
        name: Code checks
        uses: ./.github/workflows/_check_code.yaml

    integration_tests:
        name: Integration tests
        uses: ./.github/workflows/_integration_tests.yaml
        secrets:
            APIFY_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}

    release_metadata:
        # Wait for every check so a red master never publishes a beta.
        # Skip this for "ci", "docs" and "test" commits.
        needs: [ code_checks, integration_tests ]
        if: "success() && !startsWith(github.event.head_commit.message, 'ci') && !startsWith(github.event.head_commit.message, 'docs') && !startsWith(github.event.head_commit.message, 'test')"
        name: Update pre-release metadata
        uses: ./.github/workflows/_update_release_metadata.yaml
        secrets: inherit
        with:
          release_type: prerelease

    publish_to_npm:
        name: Publish to NPM
        needs: [ release_metadata ]
        runs-on: ubuntu-latest
        steps:
            -   name: Execute publish workflow
                uses: apify/actions/execute-workflow@v1.1.2
                with:
                    workflow: manual_publish_to_npm.yaml
                    inputs: >
                        {
                            "ref": "${{ needs.release_metadata.outputs.changelog_commitish }}",
                            "tag": "beta"
                        }

    smoke_test:
        name: Smoke test published package
        needs: [ publish_to_npm ]
        uses: ./.github/workflows/_smoke_test_npm_package.yaml
        with:
            npm_tag: beta
