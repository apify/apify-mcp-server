name: Smoke test npm package

on:
    workflow_call:
        inputs:
            npm_tag:
                description: NPM dist-tag to install (e.g. "beta", "latest"). Ignored when version or from_source is set.
                required: false
                type: string
                default: latest
            version:
                description: Exact version to install (e.g. "1.2.3"). Takes precedence over npm_tag.
                required: false
                type: string
                default: ""
            from_source:
                description: Build and pack the checked-out commit, then install that tarball instead of a version from the registry.
                required: false
                type: boolean
                default: false

jobs:
    smoke_test:
        name: Smoke test npm package
        runs-on: ubuntu-latest
        steps:
            -   name: Use Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: 22

            -   uses: actions/checkout@v6
                if: ${{ inputs.from_source }}
            -   name: Install pnpm and dependencies
                if: ${{ inputs.from_source }}
                uses: apify/actions/pnpm-install@v1.1.2
            -   name: Build and pack
                # `pnpm pack` keeps only what package.json#files lists, the same
                # content `pnpm publish` uploads, so the install below sees what
                # users would get from the registry.
                id: pack
                if: ${{ inputs.from_source }}
                run: |
                    pnpm run build
                    tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n1)
                    echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

            -   name: Install package
                uses: nick-fields/retry@v4
                env:
                    PKG_SPEC: ${{ steps.pack.outputs.tarball || format('@apify/actors-mcp-server@{0}', inputs.version || inputs.npm_tag) }}
                with:
                    timeout_minutes: 5
                    max_attempts: 3
                    retry_wait_seconds: 30
                    command: |
                        mkdir -p smoke-test && cd smoke-test
                        npm init -y
                        npm install "${PKG_SPEC}" @apify/mcpc

            -   name: Smoke test MCP server via mcpc
                working-directory: smoke-test
                run: |
                    echo '{"mcpServers":{"dev":{"command":"npx","args":["actors-mcp-server","--tools","docs,search-actors,fetch-actor-details","--telemetry-enabled","false"]}}}' > .mcp.json
                    npx mcpc connect .mcp.json:dev @dev
                    npx mcpc @dev ping
                    npx mcpc --json @dev tools-list | jq -e 'length > 0'
                    npx mcpc --json @dev tools-call search-actors keywords:="web scraper" | jq -e '.content[0].text'
                    npx mcpc --json @dev tools-call fetch-actor-details actor:="apify/web-scraper" | jq -e '.content[0].text'
                    npx mcpc --json @dev tools-call search-apify-docs query:="web scraping" docSource:="apify" | jq -e '.content[0].text'
                    npx mcpc --json @dev tools-call fetch-apify-docs url:="https://docs.apify.com/platform/actors" | jq -e '.content[0].text'
                    npx mcpc @dev close
