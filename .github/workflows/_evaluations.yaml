# Reusable workflow for the `pr` (tool-call) and `merge` (agent) eval tiers.

on:
    workflow_call:
        inputs:
            tier:
                description: 'Which eval tier to run'
                required: true
                type: string # 'pr' | 'merge'
        secrets:
            ANTHROPIC_API_KEY:
                required: true
            LANGFUSE_PUBLIC_KEY:
                required: true
            LANGFUSE_SECRET_KEY:
                required: true
            LANGFUSE_BASE_URL:
                required: true
            APIFY_TOKEN:
                required: true
            OPENROUTER_API_KEY:
                description: 'Judge model on OpenRouter. Only used by tier: merge.'
                required: false

jobs:
    evaluations:
        name: MCP agent evaluations (${{ inputs.tier }})
        runs-on: ubuntu-latest
        # Provisional; tighten after the first CI runs.
        timeout-minutes: ${{ inputs.tier == 'pr' && 30 || 90 }}
        env:
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
            LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
            APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        steps:
            -   name: Validate tier input
                run: |
                    if [ "${{ inputs.tier }}" != "pr" ] && [ "${{ inputs.tier }}" != "merge" ]; then
                        echo "::error::inputs.tier must be 'pr' or 'merge', got '${{ inputs.tier }}'"
                        exit 1
                    fi

            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Use Node.js
                uses: actions/setup-node@v6
                with:
                    node-version-file: '.nvmrc'

            -   name: Install pnpm and dependencies
                uses: apify/actions/pnpm-install@v1.1.2

            -   name: Seed task fixtures (merge tier only)
                if: inputs.tier == 'merge'
                run: pnpm run evals:mcp-agent:tasks-fixtures

            # Floor of three local runs was 0.93; re-pin after the first CI runs.
            # `--claude-judge` avoids the OpenRouter requirement; tool-call items are not judged.
            -   name: Run pr-tier evals
                if: inputs.tier == 'pr'
                run: >
                    pnpm run evals:mcp-agent -- --dataset mcp-server-evals-pr
                    --pass-threshold 0.9
                    --agent-model claude-haiku-4-5 --claude-judge

            # Nine items consistently fail; raise this threshold as they are fixed.
            -   name: Run merge-tier evals
                if: inputs.tier == 'merge'
                run: >
                    pnpm run evals:mcp-agent -- --dataset mcp-server-evals-merge
                    --pass-threshold 0.7
                    --agent-model claude-haiku-4-5
