# Reusable workflow for MCP agent evaluations (Langfuse-backed): the `pr` tier (fast,
# deterministic tool-selection cases) and the `full` tier (judged multi-turn agent cases).
# See evals/mcp_agent/README.md's CI section.

on:
    workflow_call:
        inputs:
            tier:
                description: 'Which eval tier to run'
                required: true
                type: string # 'pr' | 'full'
        secrets:
            ANTHROPIC_API_KEY:
                required: true
            LANGFUSE_PUBLIC_KEY:
                required: true
            LANGFUSE_SECRET_KEY:
                required: true
            LANGFUSE_BASE_URL:
                required: true
            APIFY_TOKEN:
                required: true
            OPENROUTER_API_KEY:
                description: 'Judge model on OpenRouter. Only used by tier: full.'
                required: false

jobs:
    evaluations:
        name: MCP agent evaluations (${{ inputs.tier }})
        runs-on: ubuntu-latest
        # Generous, provisional ceilings — neither tier has been timed on a real runner yet.
        # The labeled run measures actual durations; tighten these once real numbers exist
        # (see evals/mcp_agent/README.md's CI section, same "measure then tune" treatment as
        # PR_TIER_PASS_THRESHOLD and --concurrency).
        timeout-minutes: ${{ inputs.tier == 'pr' && 30 || 90 }}
        steps:
            -   name: Validate tier input
                run: |
                    if [ "${{ inputs.tier }}" != "pr" ] && [ "${{ inputs.tier }}" != "full" ]; then
                        echo "::error::inputs.tier must be 'pr' or 'full', got '${{ inputs.tier }}'"
                        exit 1
                    fi

            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Use Node.js
                uses: actions/setup-node@v6
                with:
                    node-version-file: '.nvmrc'

            -   name: Install pnpm and dependencies
                uses: apify/actions/pnpm-install@v1.1.2

            -   name: Seed task fixtures (full tier only)
                if: inputs.tier == 'full'
                run: pnpm run evals:mcp-agent:tasks-fixtures
                env:
                    APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

            -   name: Read PR tier pass threshold
                if: inputs.tier == 'pr'
                id: threshold
                run: |
                    value=$(pnpm exec tsx -e "import { PR_TIER_PASS_THRESHOLD } from './evals/mcp_agent/config.ts'; console.log(PR_TIER_PASS_THRESHOLD);")
                    echo "value=$value" >> "$GITHUB_OUTPUT"

            -   name: Run pr-tier evals
                if: inputs.tier == 'pr'
                run: >
                    pnpm run evals:mcp-agent -- --tier pr
                    --pass-threshold ${{ steps.threshold.outputs.value }}
                    --agent-model claude-haiku-4-5 --claude-judge
                env:
                    ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                    LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
                    LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
                    LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
                    APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

            # Measurement-only until a full-tier threshold exists. The CLI default is
            # --pass-threshold 1.0 (every item must pass) on claude-haiku-4-5, and the README
            # documents full-tier cases Haiku fails by design, so a blocking job here would red
            # every merge — and apify/ai-team#236 rules out a per-item all-pass gate anyway.
            # Set FULL_TIER_PASS_THRESHOLD from the first runs, pass it here, then drop this.
            # continue-on-error belongs on the step: a caller job that uses: a reusable workflow
            # does not support it.
            -   name: Run full-tier evals (not gating)
                if: inputs.tier == 'full'
                continue-on-error: true
                run: pnpm run evals:mcp-agent -- --tier full
                env:
                    ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                    LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
                    LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
                    LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
                    APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
                    OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
