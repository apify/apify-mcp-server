# Reusable workflow for MCP agent evaluations (Langfuse-backed): the `pr` tier (fast,
# deterministic tool-selection cases) and the `full` tier (judged multi-turn agent cases).
# See evals/mcp_agent/README.md's CI section.

on:
    workflow_call:
        inputs:
            tier:
                description: 'Which eval tier to run'
                required: true
                type: string # 'pr' | 'full'
        secrets:
            ANTHROPIC_API_KEY:
                required: true
            LANGFUSE_PUBLIC_KEY:
                required: true
            LANGFUSE_SECRET_KEY:
                required: true
            LANGFUSE_BASE_URL:
                required: true
            APIFY_TOKEN:
                required: true
            OPENROUTER_API_KEY:
                description: 'Judge model on OpenRouter. Only used by tier: full.'
                required: false

jobs:
    evaluations:
        name: MCP agent evaluations (${{ inputs.tier }})
        runs-on: ubuntu-latest
        # Provisional; tighten once a real runner has timed each tier (README CI section).
        timeout-minutes: ${{ inputs.tier == 'pr' && 30 || 90 }}
        env:
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
            LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
            APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        steps:
            -   name: Validate tier input
                run: |
                    if [ "${{ inputs.tier }}" != "pr" ] && [ "${{ inputs.tier }}" != "full" ]; then
                        echo "::error::inputs.tier must be 'pr' or 'full', got '${{ inputs.tier }}'"
                        exit 1
                    fi

            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Use Node.js
                uses: actions/setup-node@v6
                with:
                    node-version-file: '.nvmrc'

            -   name: Install pnpm and dependencies
                uses: apify/actions/pnpm-install@v1.1.2

            -   name: Seed task fixtures (full tier only)
                if: inputs.tier == 'full'
                run: pnpm run evals:mcp-agent:tasks-fixtures

            # --pass-threshold 0.93 is the floor of 3 claude-haiku-4-5 pr-tier runs (0.9434,
            # 0.9381, 0.9429), calibrated in apify/ai-team#240. Provisional: those runs were in a
            # sandbox with a flaky TLS proxy; re-pin from the first real CI runs.
            -   name: Run pr-tier evals
                if: inputs.tier == 'pr'
                run: >
                    pnpm run evals:mcp-agent -- --tier pr
                    --pass-threshold 0.93
                    --agent-model claude-haiku-4-5 --claude-judge

            # Measurement-only until a full-tier threshold is calibrated: without --pass-threshold
            # the CLI falls back to DEFAULT_PASS_THRESHOLD, calibrated on the pr tier, and the
            # README documents full-tier cases claude-haiku-4-5 fails by design (README CI
            # section). continue-on-error must sit on the step: a caller job that `uses:` a
            # reusable workflow does not support it.
            -   name: Run full-tier evals (not gating)
                if: inputs.tier == 'full'
                continue-on-error: true
                run: pnpm run evals:mcp-agent -- --tier full
