# Reusable workflow for MCP agent evaluations (Langfuse-backed). The `pr` tier runs the
# `kind: tool-call` items (no judge, nothing executes) and gates PRs; the `merge` tier runs
# the `kind: agent` items (judged, live account) after a merge. See evals/mcp_agent/README.md's
# CI section.

on:
    workflow_call:
        inputs:
            tier:
                description: 'Which eval tier to run'
                required: true
                type: string # 'pr' | 'merge'
        secrets:
            ANTHROPIC_API_KEY:
                required: true
            LANGFUSE_PUBLIC_KEY:
                required: true
            LANGFUSE_SECRET_KEY:
                required: true
            LANGFUSE_BASE_URL:
                required: true
            APIFY_TOKEN:
                required: true
            OPENROUTER_API_KEY:
                description: 'Judge model on OpenRouter. Only used by tier: merge.'
                required: false

jobs:
    evaluations:
        name: MCP agent evaluations (${{ inputs.tier }})
        runs-on: ubuntu-latest
        # Provisional; tighten once a real runner has timed each tier (README CI section).
        timeout-minutes: ${{ inputs.tier == 'pr' && 30 || 90 }}
        env:
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
            LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
            APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        steps:
            -   name: Validate tier input
                run: |
                    if [ "${{ inputs.tier }}" != "pr" ] && [ "${{ inputs.tier }}" != "merge" ]; then
                        echo "::error::inputs.tier must be 'pr' or 'merge', got '${{ inputs.tier }}'"
                        exit 1
                    fi

            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Use Node.js
                uses: actions/setup-node@v6
                with:
                    node-version-file: '.nvmrc'

            -   name: Install pnpm and dependencies
                uses: apify/actions/pnpm-install@v1.1.2

            -   name: Seed task fixtures (merge tier only)
                if: inputs.tier == 'merge'
                run: pnpm run evals:mcp-agent:tasks-fixtures

            # --pass-threshold 0.9: 3 claude-haiku-4-5 pr-tier runs floored at 0.93 (0.9434, 0.9381,
            # 0.9429, apify/ai-team#240), rounded down to one decimal. Provisional: those runs were in a
            # sandbox with a flaky TLS proxy; re-pin from the first real CI runs.
            # No judge runs on tool-call items; --claude-judge only lifts the CLI's
            # OPENROUTER_API_KEY requirement.
            -   name: Run pr-tier evals
                if: inputs.tier == 'pr'
                run: >
                    pnpm run evals:mcp-agent -- --tier pr
                    --pass-threshold 0.9
                    --agent-model claude-haiku-4-5 --claude-judge

            # --pass-threshold 0.7: 3 claude-haiku-4-5 merge-tier runs floored at 0.73 (0.80, 0.73, 0.80
            # on 2026-09-08, OpenRouter judge), rounded down to one decimal. Deliberately low: 9 of the
            # 60 items fail on every run (README CI section); raise it as those are fixed.
            -   name: Run merge-tier evals
                if: inputs.tier == 'merge'
                run: >
                    pnpm run evals:mcp-agent -- --tier merge
                    --pass-threshold 0.7
                    --agent-model claude-haiku-4-5
